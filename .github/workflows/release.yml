name: Release

# Push an annotated tag vX.Y.Z on a commit CI has passed on. The release gets
# one static binary per platform, SHA256SUMS, and build provenance:
#   gh attestation verify bao-acme_linux_amd64 --repo torstei/bao-acme

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CI to have passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for check in checks integration; do
            got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate \
                    --jq "[.check_runs[] | select(.name == \"$check\") | .conclusion] | join(\" \")")
            echo "$check: ${got:-<no run>}"
            case " $got " in
              *" success "*) ;;
              *) echo "::error::$check has not passed on $sha. Push, let CI finish, then tag."; exit 1 ;;
            esac
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for target in linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/torstei/bao-acme/internal/backend.Version=$GITHUB_REF_NAME" \
              -o "$dist/bao-acme_${os}_${arch}" ./cmd/bao-acme
          done
          (cd "$dist" && sha256sum bao-acme_* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/dist/bao-acme_*

      # A lightweight tag has no annotation, and %(contents:body) would return
      # the commit message instead.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$notes"
          fi
          [ -s "$notes" ] && printf '\n---\n\n' >> "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body >> "$notes"
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* \
            --notes-file "$notes" --verify-tag $prerelease
